<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards · FocusTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--s1:#171717;--s2:#212121;--s3:#2c2c2c;--line:#2a2a2a;--text:#f1f1f1;--muted:#9b9b9b;--accent:#3ea6ff;--red:#ff0033;--good:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--bg)}
.back{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
#size{color:var(--muted);font-size:12px}
.wrap{max-width:1100px;margin:0 auto;padding:8px 20px 64px}
h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:14px 0 4px}
.sub{color:var(--muted);margin-bottom:18px}
.bar{display:flex;gap:8px;margin:0 0 20px}
.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.deck{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.deck img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2)}
.in{padding:14px 16px 16px}
.in h3{margin:0;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.pill{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--s2);color:var(--muted)}
.pill.due{background:rgba(62,166,255,.15);color:var(--accent)}
.pill.new{background:rgba(74,222,128,.15);color:var(--good)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 14px Roboto,Arial,sans-serif;border:0;border-radius:22px;padding:9px 16px;cursor:pointer;color:var(--text);background:var(--s3);text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:#06121c}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px #3a3a3a}
.btn.danger{color:var(--bad)}
.btn:disabled,.btn.off{opacity:.4;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{max-width:440px;margin:12vh auto;text-align:center;color:var(--muted);font-size:16px}
.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f1f1f1;color:#111;padding:10px 18px;border-radius:22px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:600px){.wrap{padding:8px 12px 48px}header{padding:0 12px}}
</style>
</head>
<body>
<header><a class="back" href="./"><span class="logo"></span>FocusTube</a><span id="size"></span></header>
<div class="wrap"><h1>Cards</h1><div class="sub" id="sub"></div>
<div class="bar"><div class="grow"></div><button class="btn ghost" id="imp" type="button">Import pack</button><input id="file" type="file" accept=".json,application/json" hidden></div>
<div id="list"></div></div>
<div id="toast" role="status"></div>
<script>
// PURE-START
function noteLines(text) {
  const out = [];
  for (const ln of text.split('\n')) {
    const m = ln.match(/^\s*\[(?:(\d+):)?(\d+):(\d{2})\]\s*(.*)$/);
    if (m) out.push({ t: (+m[1] || 0) * 3600 + (+m[2]) * 60 + (+m[3]), txt: m[4].trim() });
  }
  return out;
}
const phraseText = (lines, a, b) => lines.filter(l => l.t >= Math.ceil(a) && l.t <= b + 0.5 && l.txt).map(l => l.txt).join(' ');
function validatePack(o) {
  if (!o || o.format !== 'focustube-pack' || !o.video || !/^[\w-]{11}$/.test(o.video.id) || !Array.isArray(o.cards)) return null;
  const cs = [];
  for (const c of o.cards.slice(0, 500)) {
    const s = +c.start, e = +c.end;
    if (!isFinite(s) || !isFinite(e) || s < 0 || e <= s || e > 86400) continue;
    const note = c.note !== undefined ? c.note : [c.target, c.native].filter(Boolean).join('\n');
    cs.push({ s: Math.round(s * 10) / 10, e: Math.round(e * 10) / 10, note: String(note || '').slice(0, 1000) });
  }
  return { id: o.video.id, title: String(o.video.title || 'Video').slice(0, 200), channel: String(o.video.channel || '').slice(0, 200), cards: cs };
}
// PURE-END
const $ = n => document.getElementById(n);
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Couldn’t save on this device'); } };
const h = (t, c, ...k) => { const e = document.createElement(t); if (c) e.className = c; for (const x of k.flat()) if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); return e; };
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let cards = LS('focus-cards', []);
const mk = (vid, s, e, note) => ({ id: uid(), vid, s, e, note, created: Date.now() });

// bring older data in: text of old cards, and marks from before cards existed
(function migrate() {
  let ch = false; const L = LS('focus-lib', {});
  cards.forEach(c => { if (c.note === undefined && (c.tgt || c.nat)) { c.note = [c.tgt, c.nat].filter(Boolean).join('\n'); delete c.tgt; delete c.nat; ch = true; } });
  for (const [vid, e] of Object.entries(L)) {
    const ms = (e.marks || []).slice().sort((a, b) => a - b); if (!ms.length) continue;
    let notes = ''; try { notes = localStorage.getItem('focus-notes:' + vid) || ''; } catch (x) {}
    const lines = noteLines(notes);
    ms.forEach((m, i) => { const s0 = i ? ms[i - 1] : 0; if (!cards.some(c => c.vid === vid && Math.abs(c.e - m) < 0.6)) cards.push(mk(vid, s0, m, phraseText(lines, s0, m))); });
    e.marks = []; ch = true;
  }
  if (ch) { put('focus-cards', cards); put('focus-lib', L); }
})();

// recordings
const dbp = new Promise((res, rej) => {
  try {
    const r = indexedDB.open('focustube', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('recs', { keyPath: 'id', autoIncrement: true }).createIndex('vid', 'vid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
});
async function tx(mode, fn) {
  const d = await dbp;
  return new Promise((res, rej) => { const t = d.transaction('recs', mode); const q = fn(t.objectStore('recs')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); });
}
async function audioBytes() { try { return ((await tx('readonly', s => s.getAll())) || []).reduce((n, r) => n + r.blob.size, 0); } catch (e) { return 0; } }
async function dropRecs(vid) {
  try { const keys = await tx('readonly', s => s.index('vid').getAllKeys(vid)); await tx('readwrite', s => { (keys || []).forEach(k => s.delete(k)); }); } catch (e) {}
}
async function meter() {
  let b = await audioBytes();
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('focus-')) b += (k.length + localStorage.getItem(k).length) * 2; } } catch (e) {}
  $('size').textContent = 'Using ' + (b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB') + ' on this device';
}

// packs: video link, times and texts. No recordings, no progress.
const safe = s => (s || '').replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'deck';
function exportPack(vid, info) {
  const pack = { format: 'focustube-pack', version: 2, video: { id: vid, title: info.t || '', channel: info.c || '' },
    cards: cards.filter(c => c.vid === vid).sort((a, b) => a.s - b.s).map(c => ({ start: c.s, end: c.e, note: c.note || '' })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }));
  a.download = safe(info.t) + '.focuspack.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importPack(file) {
  let p; try { p = validatePack(JSON.parse(await file.text())); } catch (e) { p = null; }
  if (!p || !p.cards.length) { toast('That file isn’t a valid FocusTube pack'); return; }
  let n = 0;
  p.cards.forEach(x => { if (!cards.some(c => c.vid === p.id && Math.abs(c.e - x.e) < 0.6)) { cards.push(mk(p.id, x.s, x.e, x.note)); n++; } });
  put('focus-cards', cards);
  const L = LS('focus-lib', {}); if (!L[p.id]) { L[p.id] = { t: p.title, c: p.channel, marks: [], added: Date.now(), updated: Date.now() }; put('focus-lib', L); }
  toast(n + ' cards imported'); render();
}
$('imp').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; if (f) importPack(f); $('file').value = ''; };

function render() {
  const L = LS('focus-lib', {}), list = $('list');
  const vids = [...new Set(cards.map(c => c.vid))].sort((a, b) => ((L[b] || {}).updated || 0) - ((L[a] || {}).updated || 0));
  list.replaceChildren();
  const g = h('div', 'grid');
  vids.forEach(vid => {
    const info = L[vid] || { t: 'Video', c: '' }, n = cards.filter(c => c.vid === vid).length;
    const q = '?v=' + encodeURIComponent(vid) + '&t=' + encodeURIComponent(info.t || 'Video') + '&c=' + encodeURIComponent(info.c || '');
    const img = h('img'); img.src = 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg'; img.alt = ''; img.loading = 'lazy';
    const open = h('a', 'btn primary', 'Open'); open.href = 'watch.html' + q;
    const share = h('button', 'btn ghost', 'Share'); share.type = 'button'; share.onclick = () => exportPack(vid, info);
    const del = h('button', 'btn ghost danger', 'Delete'); del.type = 'button';
    del.onclick = async () => {
      if (!confirm('Delete these cards and their recordings from this device?')) return;
      cards = cards.filter(c => c.vid !== vid); put('focus-cards', cards);
      const L2 = LS('focus-lib', {}); delete L2[vid]; put('focus-lib', L2);
      try { localStorage.removeItem('focus-notes:' + vid); } catch (e) {}
      await dropRecs(vid); render();
    };
    g.append(h('div', 'deck', img, h('div', 'in', h('h3', '', info.t || 'Video'), h('div', 'muted', info.c || ''),
      h('div', 'pills', h('span', 'pill', n + (n === 1 ? ' card' : ' cards'))), h('div', 'btns', open, share, del))));
  });
  $('sub').textContent = vids.length ? vids.length + (vids.length === 1 ? ' video' : ' videos') : 'Your videos with cards appear here';
  if (!vids.length) list.append(h('div', 'empty', h('strong', '', 'No cards yet'), 'Open a video, pause at the end of a phrase and press Mark. Each mark becomes a card.'));
  else list.append(g);
  meter();
}
render();
</script>
</body>
</html>
