<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · FocusTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#272727;--text:#f1f1f1;--muted:#aaa;--red:#ff0033;--blue:#3ea6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--bg)}
.back{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
#size{color:var(--muted);font-size:12px}
main{max-width:900px;margin:0 auto;padding:8px 20px 48px}
h1{font-size:20px;margin:8px 0 16px}
.row{display:flex;gap:14px;margin-bottom:16px;align-items:flex-start}
.row img{flex:none;width:168px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--panel)}
.txt{min-width:0;flex:1}
.t{margin:0;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--muted);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns a,.btns button{font:500 13px Roboto,Arial,sans-serif;color:var(--text);background:var(--panel);border:0;border-radius:18px;padding:7px 14px;cursor:pointer;text-decoration:none}
.btns a:hover,.btns button:hover{background:#3a3a3a}
.btns a:focus-visible,.btns button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.empty{max-width:420px;margin:15vh auto;text-align:center;color:var(--muted);font-size:16px}
.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
@media (max-width:600px){main{padding:8px 12px 32px}.row{flex-direction:column;gap:8px}.row img{width:100%}header{padding:0 12px}}
</style>
</head>
<body>
<header><a class="back" href="./"><span class="logo"></span>FocusTube</a><span style="display:flex;align-items:center;gap:14px"><span id="size"></span><a href="cards.html" style="color:var(--text);text-decoration:none;font-weight:500;background:var(--panel);padding:7px 14px;border-radius:18px">Cards</a></span></header>
<main><h1>Library</h1><div id="list"></div></main>
<script>
const list = document.getElementById('list');
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  const u = [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60]];
  for (const [n, v] of u) if (s >= v) { const k = Math.floor(s / v); return k + ' ' + n + (k > 1 ? 's' : '') + ' ago'; }
  return 'just now';
}
function lib() { try { return JSON.parse(localStorage.getItem('focus-lib') || '{}'); } catch (e) { return {}; } }
function notes(id) { try { return localStorage.getItem('focus-notes:' + id) || ''; } catch (e) { return ''; } }
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
const dbp = new Promise((res, rej) => {
  try {
    const r = indexedDB.open('focustube', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('recs', { keyPath: 'id', autoIncrement: true }).createIndex('vid', 'vid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
});
async function tx(mode, fn) {
  const d = await dbp;
  return new Promise((res, rej) => {
    const t = d.transaction('recs', mode); const q = fn(t.objectStore('recs'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
}
async function recStats() {
  const out = { total: 0 };
  try { for (const r of (await tx('readonly', s => s.getAll())) || []) { const o = out[r.vid] || (out[r.vid] = { n: 0 }); o.n++; out.total += r.blob.size; } } catch (e) {}
  return out;
}
async function dropRecs(id) {
  try {
    const keys = await tx('readonly', s => s.index('vid').getAllKeys(id));
    await tx('readwrite', s => { (keys || []).forEach(k => s.delete(k)); });
  } catch (e) {}
}
function size(extra) {
  let b = extra || 0;
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('focus-')) b += (k.length + localStorage.getItem(k).length) * 2; } } catch (e) {}
  document.getElementById('size').textContent = 'Using ' + (b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB') + ' on this device';
}
async function render() {
  const l = lib(), stats = await recStats();
  const ids = Object.keys(l).sort((a, b) => l[b].updated - l[a].updated);
  list.replaceChildren();
  size(stats.total);
  if (!ids.length) {
    const e = mk('div', 'empty');
    e.append(mk('strong', '', 'Nothing here yet'), document.createTextNode('Videos where you add a mark or a note are saved here automatically.'));
    list.append(e); return;
  }
  for (const id of ids) {
    const v = l[id], n = notes(id).trim(), words = n ? n.split(/\s+/).length : 0;
    const row = mk('div', 'row');
    const img = mk('img'); img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; img.alt = ''; img.loading = 'lazy';
    const txt = mk('div', 'txt');
    const meta = mk('div', 'm', (v.c ? v.c + ' · ' : '') + (v.marks || []).length + ' marks · ' + words + ' words · ' + ((stats[id] || {}).n || 0) + ' recordings · ' + ago(v.updated));
    const btns = mk('div', 'btns');
    const open = mk('a', '', 'Open'); open.href = 'watch.html?v=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(v.t || 'Video') + '&c=' + encodeURIComponent(v.c || '');
    const del = mk('button', '', 'Delete'); del.type = 'button';
    del.onclick = async () => {
      if (!confirm('Delete the marks, notes and recordings of this video from this device?')) return;
      await dropRecs(id);
      const cur = lib(); delete cur[id];
      try { localStorage.setItem('focus-lib', JSON.stringify(cur)); localStorage.removeItem('focus-notes:' + id); } catch (e) {}
      render();
    };
    btns.append(open, del);
    txt.append(mk('h3', 't', v.t || 'Video'), meta, btns);
    row.append(img, txt); list.append(row);
  }
}
render();
</script>
</body>
</html>
