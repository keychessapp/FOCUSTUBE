<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--s1:#171717;--s2:#212121;--s3:#2e2e2e;--line:#2a2a2a;--text:#f1f1f1;--muted:#9b9b9b;--red:#ff0033;--blue:#3ea6ff;--stickh:300px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--bg)}
.back{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:20px;font-weight:700;letter-spacing:-.5px}
.back small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.logo{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
nav a{color:var(--text);text-decoration:none;font-weight:500;background:var(--s2);padding:7px 14px;border-radius:18px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 48px}
.stick{position:sticky;top:56px;z-index:5;background:var(--bg);padding:8px 0 6px}
.player{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.mark{display:block;width:100%;margin-top:10px;height:50px;border:0;border-radius:25px;background:var(--red);color:#fff;font:500 16px Roboto,Arial,sans-serif;cursor:pointer}
.mark:hover{background:#d4002a}
.status{min-height:20px;margin-top:4px;color:var(--muted);font-size:12px;text-align:center}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{margin:10px 0 2px;font-size:20px;line-height:28px;font-weight:700}
.meta,.muted{color:var(--muted)}
.chead{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.grow{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;scroll-margin-top:var(--stickh)}
.card.cur{border-color:var(--blue)}
.row{display:flex;align-items:center;gap:10px}
.cnum{font-size:30px;font-weight:700;line-height:1;min-width:40px;letter-spacing:-1px}
.bigbtn{flex:1;height:48px;border:0;border-radius:24px;font:500 16px Roboto,Arial,sans-serif;color:var(--text);background:var(--s3);cursor:pointer}
.bigbtn:hover{filter:brightness(1.15)}
.bigbtn.play{background:var(--text);color:#000}
.bigbtn.live{background:#b3001f;color:#fff}
.chip{border:0;border-radius:14px;padding:5px 11px;font:500 12px Roboto,Arial,sans-serif;background:var(--s3);color:var(--text);cursor:pointer}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px #3a3a3a;padding:6px 14px;font-size:13px}
.take{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.empty{grid-column:1/-1;color:var(--muted);padding:12px 2px}
@media (max-width:760px){
  .wrap{padding:0 0 40px}
  .player{border-radius:0}
  .mark{width:calc(100% - 24px);margin:10px 12px 0}
  h1,.meta,.chead,.cards{margin-left:12px;margin-right:12px}
  .cards{grid-template-columns:1fr}
  header{padding:0 12px}
}
</style>
</head>
<body>
<header><a class="back" href="./"><span class="logo"></span>FocusTube<small>← back</small></a><nav><a href="cards.html">Cards</a></nav></header>
<main class="wrap">
  <div class="stick" id="stick">
    <div class="player"><div id="yt"></div></div>
    <button id="bMark" class="mark" type="button">＋ Mark</button>
    <div class="status" id="status"></div>
  </div>
  <h1 id="title"></h1>
  <div class="meta" id="channel"></div>
  <div class="chead"><span class="muted" id="count"></span><span class="grow"></span><button class="chip ghost" id="exp" type="button" hidden>Export</button></div>
  <div class="cards" id="list"></div>
</main>
<script>
// PURE-START
function noteLines(text) {
  const out = [];
  for (const ln of text.split('\n')) {
    const m = ln.match(/^\s*\[(?:(\d+):)?(\d+):(\d{2})\]\s*(.*)$/);
    if (m) out.push({ t: (+m[1] || 0) * 3600 + (+m[2]) * 60 + (+m[3]), txt: m[4].trim() });
  }
  return out;
}
const phraseText = (lines, a, b) => lines.filter(l => l.t >= Math.ceil(a) && l.t <= b + 0.5 && l.txt).map(l => l.txt).join(' ');
// PURE-END

const $ = n => document.getElementById(n);
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const status = $('status');
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { status.textContent = 'Couldn’t save on this device.'; } };
const h = (t, c, ...k) => { const e = document.createElement(t); if (c) e.className = c; for (const x of k.flat()) if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); return e; };
const btn = (t, cls, f) => { const b = h('button', cls, t); b.type = 'button'; b.onclick = f; return b; };
function fmt(sec) {
  const hr = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60), two = n => String(n).padStart(2, '0');
  return hr ? hr + ':' + two(m) + ':' + two(s) : m + ':' + two(s);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const p = new URLSearchParams(location.search);
const id = (p.get('v') || '').match(/^[\w-]{11}$/) ? p.get('v') : null;
const titleText = p.get('t') || 'Video', chan = p.get('c') || '';
$('title').textContent = id ? titleText : 'No video selected';
$('channel').textContent = chan;
document.title = titleText + ' · FocusTube';

// ---- data (older marks and notes are carried over into cards)
let all = LS('focus-cards', []);
(function migrate() {
  let ch = false;
  all.forEach(c => { if (c.note === undefined && (c.tgt || c.nat)) { c.note = [c.tgt, c.nat].filter(Boolean).join('\n'); delete c.tgt; delete c.nat; ch = true; } });
  const L = LS('focus-lib', {}), e = id && L[id];
  if (e && (e.marks || []).length) {
    let notes = ''; try { notes = localStorage.getItem('focus-notes:' + id) || ''; } catch (x) {}
    const lines = noteLines(notes), ms = e.marks.slice().sort((a, b) => a - b);
    ms.forEach((m, i) => {
      const s0 = i ? ms[i - 1] : 0;
      if (all.some(c => c.vid === id && Math.abs(c.e - m) < 0.6)) return;
      all.push({ id: uid(), vid: id, s: s0, e: m, note: phraseText(lines, s0, m), created: Date.now() });
    });
    e.marks = []; put('focus-lib', L); ch = true;
  }
  if (ch) put('focus-cards', all);
})();
const save = () => put('focus-cards', all);
const mine = () => all.filter(c => c.vid === id).sort((a, b) => a.s - b.s);
function touch() {
  const L = LS('focus-lib', {}), e = L[id] || { added: Date.now() };
  e.t = titleText; e.c = chan; e.marks = []; e.updated = Date.now(); L[id] = e; put('focus-lib', L);
}

// ---- recordings (IndexedDB)
const dbp = new Promise((res, rej) => {
  try {
    const r = indexedDB.open('focustube', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('recs', { keyPath: 'id', autoIncrement: true }).createIndex('vid', 'vid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
});
async function tx(mode, fn) {
  const d = await dbp;
  return new Promise((res, rej) => {
    const t = d.transaction('recs', mode); const q = fn(t.objectStore('recs'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
}
let recs = [], curAudio = null;
async function loadRecs() { try { recs = (await tx('readonly', s => s.index('vid').getAll(id))) || []; } catch (e) { recs = []; } }
const takesOf = c => recs.filter(r => r.at > c.s && r.at <= c.e + 0.5).sort((a, b) => b.ts - a.ts);
function playRec(r) {
  if (curAudio) curAudio.pause();
  if (ready()) player.pauseVideo();
  const u = URL.createObjectURL(r.blob); curAudio = new Audio(u);
  curAudio.onended = () => URL.revokeObjectURL(u); curAudio.play();
}
let mr, chunks = [], stream, t0 = 0, tick;
async function toggleRec(at, b, after) {
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { status.textContent = 'Recording isn’t supported in this browser.'; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { status.textContent = 'Microphone blocked. Allow it in the browser settings.'; return; }
  clearInterval(iv); if (curAudio) curAudio.pause(); if (ready()) player.pauseVideo();
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined); chunks = [];
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearInterval(tick); stream.getTracks().forEach(t => t.stop()); b.classList.remove('live'); b.textContent = '🎙 Record';
    const blob = new Blob(chunks, { type: mr.mimeType || type || 'audio/webm' });
    const dur = Math.max(1, Math.round((Date.now() - t0) / 1000));
    try { await tx('readwrite', s => s.add({ vid: id, at, ts: Date.now(), dur, blob })); touch(); try { navigator.storage.persist(); } catch (e) {} }
    catch (e) { status.textContent = 'Couldn’t save the recording on this device.'; }
    await loadRecs(); if (after) after();
  };
  mr.start(); t0 = Date.now(); b.classList.add('live'); b.textContent = '■ Stop 0s';
  tick = setInterval(() => { b.textContent = '■ Stop ' + Math.round((Date.now() - t0) / 1000) + 's'; }, 500);
}

// ---- player
let player, iv, startedAt = 0, cur = 0, rows = [];
const ready = () => player && player.getCurrentTime;
if (id) {
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      videoId: id, host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%',
      playerVars: { autoplay: 1, rel: 0, playsinline: 1 },
      events: { onStateChange: e => { if (e.data === 0 || (e.data === 2 && Date.now() - startedAt > 600)) clearInterval(iv); } }
    });
  };
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
}
function playRange(a, b) {
  if (!ready()) return;
  clearInterval(iv); player.seekTo(a, true); player.playVideo(); startedAt = Date.now();
  iv = setInterval(() => {
    if (Date.now() - startedAt > 400 && player.getCurrentTime() >= b - 0.05) { player.pauseVideo(); clearInterval(iv); }
  }, 60);
}
function playCard(i) {
  const c = mine()[i]; if (!c) return;
  cur = i; playRange(c.s, c.e); highlight();
}
function highlight() {
  rows.forEach((r, i) => r.classList.toggle('cur', i === cur));
  if (rows[cur] && rows[cur].scrollIntoView) rows[cur].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function addMark() {
  if (!ready() || !id) return;
  const t = Math.round(player.getCurrentTime() * 10) / 10, l = mine();
  if (t < 0.5 || l.some(c => Math.abs(c.e - t) < 0.6)) return;
  const host = l.find(c => c.s < t - 0.3 && t < c.e - 0.3);
  let s0;
  if (host) { s0 = host.s; host.s = t; }
  else { const prev = l.filter(c => c.e <= t).sort((a, b) => b.e - a.e)[0]; s0 = prev ? prev.e : 0; }
  const nc = { id: uid(), vid: id, s: s0, e: t, created: Date.now() };
  all.push(nc); save(); touch(); cur = mine().indexOf(nc);
  renderList(); highlight();
  status.textContent = 'Card ' + (cur + 1) + ' added';
}
$('bMark').onclick = addMark;
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  if (e.key === 'm' || e.key === 'M') addMark();
  else if (e.key === ' ' && ready()) player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
  else return;
  e.preventDefault();
});

// ---- cards, in the order of the video
function renderList() {
  const l = mine(), box = $('list'); rows = []; box.replaceChildren();
  if (cur > l.length - 1) cur = Math.max(0, l.length - 1);
  $('count').textContent = l.length ? l.length + (l.length === 1 ? ' card' : ' cards') : '';
  $('exp').hidden = !l.length;
  if (!l.length) box.append(h('div', 'empty', 'Pause at the end of a phrase and press Mark. Each mark creates a card.'));
  l.forEach((c, i) => {
    const play = btn('▶ Play', 'bigbtn play', () => playCard(i));
    const rec = btn('🎙 Record', 'bigbtn', () => toggleRec(c.e - 0.01, rec, renderList));
    const del = btn('×', 'chip', () => { if (confirm('Delete card ' + (i + 1) + '?')) { all = all.filter(x => x.id !== c.id); save(); renderList(); } });
    del.setAttribute('aria-label', 'Delete card ' + (i + 1));
    const t = takesOf(c)[0];
    const take = t ? h('div', 'take', btn('▶ Your take · ' + t.dur + 's', 'chip', () => playRec(t)),
      btn('×', 'chip', async () => { try { await tx('readwrite', s => s.delete(t.id)); } catch (e) {} await loadRecs(); renderList(); })) : null;
    const row = h('div', 'card' + (i === cur ? ' cur' : ''), h('div', 'row', h('span', 'cnum', String(i + 1)), play, rec, del), take);
    rows.push(row); box.append(row);
  });
}

// ---- export: folder on PC, share sheet on phone, separate files otherwise
const safe = s => s.replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'cards';
const ext = r => (r.blob.type || '').includes('mp4') ? 'm4a' : 'webm';
function exportFiles(inFolder) {
  const base = safe(titleText), l = mine();
  const text = titleText + '\n\n' + l.map((c, i) => (i + 1) + '. [' + fmt(c.s) + ' – ' + fmt(c.e) + '] ' + (c.note || '').replace(/\n/g, ' ')).join('\n');
  const files = [{ name: inFolder ? 'cards.txt' : base + ' - cards.txt', blob: new Blob([text], { type: 'text/plain' }) }];
  l.forEach((c, i) => takesOf(c).reverse().forEach((r, k) => {
    const n = 'card ' + String(i + 1).padStart(2, '0') + ' - take ' + (k + 1) + '.' + ext(r);
    files.push({ name: inFolder ? n : base + ' - ' + n, blob: r.blob });
  }));
  return files;
}
$('exp').onclick = async () => {
  try {
    if (window.showDirectoryPicker) {
      const root = await showDirectoryPicker({ mode: 'readwrite' });
      const dir = await root.getDirectoryHandle(safe(titleText), { create: true });
      for (const f of exportFiles(true)) { const w = await (await dir.getFileHandle(f.name, { create: true })).createWritable(); await w.write(f.blob); await w.close(); }
      status.textContent = 'Exported to the folder “' + safe(titleText) + '”'; return;
    }
    const files = exportFiles(false).map(f => new File([f.blob], f.name, { type: f.blob.type }));
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title: titleText }); status.textContent = 'Shared'; return; }
    for (const f of files) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); await new Promise(r => setTimeout(r, 400)); URL.revokeObjectURL(a.href); }
    status.textContent = 'Downloaded ' + files.length + ' files';
  } catch (e) { if (e.name !== 'AbortError') status.textContent = 'Export failed.'; }
};

// ---- start
function sizeStick() { document.documentElement.style.setProperty('--stickh', ($('stick').offsetHeight + 64) + 'px'); }
window.addEventListener('resize', sizeStick);
cur = Math.max(0, mine().length - 1);
(async () => { if (id) await loadRecs(); renderList(); sizeStick(); })();
</script>
</body>
</html>
