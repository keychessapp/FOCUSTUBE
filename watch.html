<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#1c1c1c;--line:#303030;--text:#f1f1f1;--muted:#aaa;--red:#ff0033;--blue:#3ea6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--bg)}
nav a{color:var(--text);text-decoration:none;font-weight:500;background:#272727;padding:7px 14px;border-radius:18px}
.back{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.back small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:8px 20px 32px;align-items:start}
.player{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
h1{margin:12px 0 4px;font-size:20px;line-height:28px;font-weight:700}
.meta{color:var(--muted);font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ctrl button{flex:1 1 auto;font:500 14px Roboto,Arial,sans-serif;color:var(--text);background:#272727;border:0;border-radius:20px;padding:11px 14px;cursor:pointer}
.ctrl button:hover{background:#3a3a3a}
.ctrl .mark{background:var(--red)}
.ctrl .mark:hover{background:#d4002a}
.ctrl button:focus-visible,.chip button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;min-height:44px}
.chip{display:flex;flex:none;background:#272727;border-radius:16px;overflow:hidden}
.chip.on{background:#3b3b3b;box-shadow:inset 0 0 0 1px var(--blue)}
.chip button{font:400 13px Roboto,Arial,sans-serif;color:var(--text);background:none;border:0;padding:6px 10px;cursor:pointer}
.chip .x{color:var(--muted);padding:6px 10px 6px 2px}
.hint{color:var(--muted);font-size:13px;padding-top:12px}
.notes{position:sticky;top:64px;height:calc(100vh - 80px);min-height:320px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar h2{margin:0 auto 0 4px;font-size:16px;font-weight:500}
.bar button{font:500 13px Roboto,Arial,sans-serif;color:var(--text);background:#2a2a2a;border:0;border-radius:18px;padding:7px 12px;cursor:pointer}
.bar button:hover{background:#3a3a3a}
.bar button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
textarea{flex:1;width:100%;resize:none;border:0;background:transparent;color:var(--text);font:400 16px/1.6 Roboto,Arial,sans-serif;padding:14px 16px}
.status{padding:6px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:12px;padding:0 0 24px}
  .stick{position:sticky;top:56px;z-index:5;background:var(--bg);padding-bottom:4px}
  .ctrl,.chips{padding-left:12px;padding-right:12px}
  .player{border-radius:0}
  h1,.meta{padding:0 12px}
  .notes{position:static;height:60vh;margin:0 12px}
  header{padding:0 12px}
}
</style>
</head>
<body>
<header><a class="back" href="./"><span class="logo"></span>FocusTube<small>← back</small></a><nav><a href="library.html">Library</a></nav></header>
<div class="layout">
  <section class="left">
    <div class="stick">
      <div class="player"><div id="yt"></div></div>
      <div class="ctrl">
        <button id="bStart" type="button">⏮ Start</button>
        <button id="bPrev" type="button">◀ Prev</button>
        <button id="bReplay" type="button">↻ Replay</button>
        <button id="bNext" type="button">Next ▶</button>
        <button id="bMark" class="mark" type="button">＋ Mark</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <h1 id="title"></h1>
    <div class="meta" id="channel"></div>
  </section>
  <aside class="notes">
    <div class="bar">
      <h2>Notes</h2>
      <button id="stamp" type="button">⏱ Timestamp</button>
      <button id="copy" type="button">Copy</button>
      <button id="dl" type="button">Download</button>
    </div>
    <textarea id="pad" placeholder="Write your notes here…" spellcheck="true"></textarea>
    <div class="status" id="status">Notes are saved on this device.</div>
  </aside>
</div>
<script>
const p = new URLSearchParams(location.search);
const id = (p.get('v') || '').match(/^[\w-]{11}$/) ? p.get('v') : null;
const titleText = p.get('t') || 'Video';
document.getElementById('title').textContent = titleText;
document.getElementById('channel').textContent = p.get('c') || '';
document.title = titleText + ' · FocusTube';

const pad = document.getElementById('pad');
const status = document.getElementById('status');
const KEY = 'focus-notes:' + id;
try { pad.value = localStorage.getItem(KEY) || ''; } catch (e) {}
let timer;
function save() {
  try { localStorage.setItem(KEY, pad.value); if (pad.value.trim() && id) touch(); status.textContent = 'Saved on this device'; }
  catch (e) { status.textContent = 'Couldn’t save here. Use Copy or Download.'; }
}
pad.addEventListener('input', () => { status.textContent = 'Saving…'; clearTimeout(timer); timer = setTimeout(save, 300); });

const LIB = 'focus-lib';
function loadLib() { try { return JSON.parse(localStorage.getItem(LIB) || '{}'); } catch (e) { return {}; } }
let marks = ((loadLib()[id] || {}).marks || []).slice();
let cur = Math.max(0, marks.length - 1);
function touch() {
  const l = loadLib();
  const e = l[id] || { added: Date.now() };
  e.t = titleText; e.c = p.get('c') || ''; e.marks = marks; e.updated = Date.now();
  l[id] = e;
  try { localStorage.setItem(LIB, JSON.stringify(l)); } catch (err) { status.textContent = 'Couldn’t save here. Use Copy or Download.'; }
}

let player, iv, startedAt = 0;
if (id) {
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      videoId: id, host: 'https://www.youtube-nocookie.com',
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, rel: 0, playsinline: 1 },
      events: { onStateChange: e => {
        if (e.data === 0 || (e.data === 2 && Date.now() - startedAt > 600)) clearInterval(iv);
      } }
    });
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
} else {
  document.getElementById('title').textContent = 'No video selected';
}

function fmt(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const two = n => String(n).padStart(2, '0');
  return h ? h + ':' + two(m) + ':' + two(s) : m + ':' + two(s);
}
function renderMarks() {
  const box = document.getElementById('chips');
  box.replaceChildren();
  if (!marks.length) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Pause at the end of a phrase and press Mark.'; box.append(h); return; }
  marks.forEach((m, i) => {
    const c = document.createElement('div'); c.className = 'chip' + (i === cur ? ' on' : '');
    const go = document.createElement('button'); go.type = 'button'; go.textContent = (i + 1) + ' · ' + fmt(Math.floor(m));
    go.onclick = () => playPhrase(i);
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Delete mark ' + (i + 1));
    x.onclick = () => { marks.splice(i, 1); cur = Math.max(0, Math.min(cur, marks.length - 1)); touch(); renderMarks(); };
    c.append(go, x); box.append(c);
  });
}
function ready() { return player && player.getCurrentTime; }
function addMark() {
  if (!ready()) return;
  const t = Math.round(player.getCurrentTime() * 10) / 10;
  if (t < 0.5 || marks.some(m => Math.abs(m - t) < 0.6)) return;
  marks.push(t); marks.sort((a, b) => a - b); cur = marks.indexOf(t);
  touch(); renderMarks();
}
function playPhrase(i) {
  if (!ready()) return;
  clearInterval(iv);
  if (!marks.length) { player.seekTo(Math.max(0, player.getCurrentTime() - 5), true); player.playVideo(); return; }
  cur = Math.max(0, Math.min(marks.length - 1, i));
  const s = cur ? marks[cur - 1] : 0, e = marks[cur];
  player.seekTo(s, true); player.playVideo(); startedAt = Date.now();
  iv = setInterval(() => {
    if (Date.now() - startedAt > 400 && player.getCurrentTime() >= e - 0.05) { player.pauseVideo(); clearInterval(iv); }
  }, 80);
  renderMarks();
}
function togglePlay() { if (ready()) (player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo()); }
document.getElementById('bMark').onclick = addMark;
document.getElementById('bReplay').onclick = () => playPhrase(cur);
document.getElementById('bPrev').onclick = () => playPhrase(cur - 1);
document.getElementById('bNext').onclick = () => playPhrase(cur + 1);
document.getElementById('bStart').onclick = () => {
  clearInterval(iv);
  if (marks.length) playPhrase(0); else if (ready()) { player.seekTo(0, true); player.playVideo(); }
};
document.addEventListener('keydown', e => {
  if (/^(TEXTAREA|INPUT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft') playPhrase(e.shiftKey ? cur - 1 : cur);
  else if (k === 'ArrowRight') playPhrase(cur + 1);
  else if (k === 'm' || k === 'M') addMark();
  else if (k === ' ') togglePlay();
  else return;
  e.preventDefault();
});
renderMarks();

document.getElementById('stamp').onclick = () => {
  if (!player || !player.getCurrentTime) return;
  const tag = '[' + fmt(Math.floor(player.getCurrentTime())) + '] ';
  const a = pad.selectionStart, b = pad.selectionEnd;
  const before = pad.value.slice(0, a);
  const lead = before && !before.endsWith('\n') ? '\n' : '';
  pad.value = before + lead + tag + pad.value.slice(b);
  const pos = (before + lead + tag).length;
  pad.focus(); pad.setSelectionRange(pos, pos);
  save();
};
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(pad.value); status.textContent = 'Copied'; }
  catch (e) { pad.select(); status.textContent = 'Press copy on your keyboard'; }
};
document.getElementById('dl').onclick = () => {
  const blob = new Blob([titleText + '\n\n' + pad.value + (marks.length ? '\n\nMarks (phrase ends):\n' + marks.map((m, i) => (i + 1) + '. ' + fmt(Math.floor(m))).join('\n') : '')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (titleText.replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'notes') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
