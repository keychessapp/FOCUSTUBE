name: Update latest videos
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths: ['channels.txt']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update.mjs
      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Update latest videos" && git push)
