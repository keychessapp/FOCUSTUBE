<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#272727;--text:#f1f1f1;--muted:#aaa;--red:#ff0033;--blue:#3ea6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
#updated{color:var(--muted);font-size:12px}
nav{display:flex;align-items:center;gap:16px}
nav a{color:var(--text);text-decoration:none;font-weight:500;background:var(--panel);padding:7px 14px;border-radius:18px}
main{max-width:1500px;margin:0 auto;padding:16px 20px 48px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:32px 16px}
.media{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;border:0;padding:0;width:100%;display:block}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;width:56px;height:40px;margin:-20px 0 0 -28px;border-radius:12px;background:rgba(0,0,0,.65);opacity:0;transition:opacity .15s}
.play::after{content:"";position:absolute;left:23px;top:11px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.media:hover .play,.media:focus-visible .play{opacity:1;background:var(--red)}
.media:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.info{display:flex;gap:12px;margin-top:12px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:16px;color:#fff}
.title{margin:0;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:4px;color:var(--muted);font-size:14px}
.meta b{font-weight:400}
.new{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--panel);color:var(--text);font-size:12px;font-weight:500;line-height:18px}
.empty{max-width:420px;margin:15vh auto;text-align:center;color:var(--muted);font-size:16px}
.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
@media (max-width:600px){main{padding:8px 0 32px}#grid{gap:24px}.media{border-radius:0}.info{padding:0 12px}header{padding:0 12px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>FocusTube</div>
  <nav><span id="updated"></span><a href="cards.html">Cards</a></nav>
</header>
<main><div id="grid"></div></main>
<script>
const grid = document.getElementById('grid');
const KEY = 'focus-seen';
let seen = {};
try { seen = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
function markSeen(src, id) {
  seen[src] = id;
  try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {}
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  const units = [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60]];
  for (const [n, v] of units) if (s >= v) { const k = Math.floor(s / v); return k + ' ' + n + (k > 1 ? 's' : '') + ' ago'; }
  return 'just now';
}
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function card(v) {
  const wrap = el('article');
  const media = el('button', 'media');
  media.setAttribute('aria-label', 'Play ' + v.title);
  const img = el('img'); img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg'; img.alt = ''; img.loading = 'lazy';
  media.append(img, el('span', 'play'));
  const info = el('div', 'info');
  const av = el('div', 'avatar', (v.channel[0] || '?').toUpperCase());
  av.style.background = 'hsl(' + hue(v.channel) + ' 45% 38%)';
  const text = el('div');
  const title = el('h3', 'title', v.title);
  const meta = el('div', 'meta');
  meta.append(el('b', '', v.channel), document.createElement('br'), document.createTextNode(ago(v.published)));
  const isNew = seen[v.source] !== v.id;
  let chip = null;
  if (isNew) { chip = el('span', 'new', 'New'); meta.append(chip); }
  text.append(title, meta);
  info.append(av, text);
  wrap.append(media, info);
  const play = () => {
    markSeen(v.source, v.id);
    location.href = 'watch.html?v=' + encodeURIComponent(v.id) + '&t=' + encodeURIComponent(v.title) + '&c=' + encodeURIComponent(v.channel);
  };
  media.onclick = play;
  title.style.cursor = 'pointer';
  title.onclick = play;
  return wrap;
}

fetch('latest.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    if (d.updated) document.getElementById('updated').textContent = 'Updated ' + ago(d.updated);
    if (!d.items.length) {
      const e = el('div', 'empty');
      e.append(el('strong', '', 'No channels yet'), document.createTextNode('Add channels to channels.txt in your repo. This page fills in within a minute.'));
      grid.replaceWith(e);
      return;
    }
    d.items.forEach(v => grid.append(card(v)));
  })
  .catch(() => {
    const e = el('div', 'empty');
    e.append(el('strong', '', 'Couldn’t load videos'), document.createTextNode('Check that latest.json exists in your repo, then reload.'));
    grid.replaceWith(e);
  });
</script>
</body>
</html>
